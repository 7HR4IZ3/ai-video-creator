name: Story and voice auditions

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Voice model to audition, or all four independently
        type: choice
        default: all
        options: [all, qwen3-custom, chatterbox-nano, chatterbox-turbo, kokoro]
      run_editor:
        description: Also test the OpenCode story editor independently
        type: boolean
        default: true
      story_model:
        description: OpenCode provider/model for the editor test
        type: string
        default: opencode/muse-spark-1.3-contributor-free

permissions:
  contents: read

jobs:
  checks:
    name: Story contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun test tests/story
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile utils/story_voice.py
      - run: python -m unittest discover -s tests/story -p "*_test.py"

  editor:
    name: OpenCode story editor
    if: ${{ inputs.run_editor }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORY_AI_PROVIDER: opencode
      OPENCODE_STORY_MODEL: ${{ inputs.story_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install the official OpenCode CLI
        run: bun add --global --trust @opencode/cli@2.0.29
      - name: Write and review a story through OpenCode
        shell: bash
        run: |
          mkdir -p audition/editor
          opencode --version | tee audition/editor/version.txt
          bun run src/story/cli.ts --source tests/story/fixtures/source.json --seconds 60 --output-dir audition/editor 2>&1 | tee audition/editor/generation.log
      - name: Upload script, review, and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-editor
          path: audition/editor/
          retention-days: 14

  voice:
    name: Voice ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.voice == 'all' && '["qwen3-custom","chatterbox-nano","chatterbox-turbo","kokoro"]' || format('["{0}"]', inputs.voice)) }}
    env:
      VOICE_MODEL: ${{ matrix.model }}
      TTS_CPU_THREADS: '4'
      TTS_SEED: '42'
      TTS_SPEAKER: Ryan
      TTS_VOICE: af_heart
      TTS_SPEED: '1.0'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: 0.7.14
          cache-dependency-glob: requirements/story/*.txt
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libsndfile1 sox
      - name: Select isolated dependencies
        shell: bash
        run: |
          case "$VOICE_MODEL" in
            qwen3-custom) echo 'VOICE_REQUIREMENTS=requirements/story/qwen.txt' >> "$GITHUB_ENV" ;;
            chatterbox-*) echo 'VOICE_REQUIREMENTS=requirements/story/chatterbox.txt' >> "$GITHUB_ENV" ;;
            kokoro) echo 'VOICE_REQUIREMENTS=requirements/story/kokoro.txt' >> "$GITHUB_ENV" ;;
          esac
          uv venv --python 3.11 .voice-venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.voice-venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.voice-venv/bin" >> "$GITHUB_PATH"
      - name: Install this voice's pinned CPU dependencies
        run: uv pip sync --python .voice-venv/bin/python --extra-index-url https://download.pytorch.org/whl/cpu "$VOICE_REQUIREMENTS"
      - name: Verify Kokoro English processing before downloading voice weights
        if: matrix.model == 'kokoro'
        run: .voice-venv/bin/python -c "import spacy; nlp = spacy.load('en_core_web_sm', enable=['tok2vec', 'tagger']); assert len(nlp('The spare key.')) > 0"
      - name: Cache this voice's downloaded weights
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: voice-weights-v1-${{ runner.os }}-${{ matrix.model }}-${{ hashFiles('utils/story_voice.py') }}
      - name: Render the same fixed script
        shell: bash
        run: |
          mkdir -p "audition/$VOICE_MODEL"
          cp tests/story/fixtures/production.json "audition/$VOICE_MODEL/production.json"
          /usr/bin/time -v .voice-venv/bin/python utils/story_voice.py --production tests/story/fixtures/production.json --model "$VOICE_MODEL" --output "audition/$VOICE_MODEL/narration.mp3" 2>&1 | tee "audition/$VOICE_MODEL/generation.log"
          ffprobe -v quiet -show_format -show_streams -of json "audition/$VOICE_MODEL/narration.mp3" > "audition/$VOICE_MODEL/audio-info.json"
      - name: Upload this voice even if another job fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.model }}
          path: audition/${{ matrix.model }}/
          retention-days: 14
