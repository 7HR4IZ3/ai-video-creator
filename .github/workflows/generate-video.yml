name: Generate Social Video

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Fixture for a full pipeline check, or Reddit for real stories
        type: choice
        default: fixture
        options: [fixture, reddit]
      subreddit:
        description: Subreddit used when source is Reddit
        type: string
        default: AITAH
      background_url:
        description: Direct footage URL; fixture mode uses a test pattern if omitted
        type: string
      voice:
        description: Local narrator
        type: choice
        default: chatterbox-turbo
        options: [chatterbox-turbo, chatterbox-nano, qwen3-custom, kokoro]
      seconds:
        description: Target narration duration in seconds
        type: string
        default: '75'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      STORY_AI_PROVIDER: opencode
      OPENCODE_STORY_MODEL: opencode/muse-spark-1.3-contributor-free
      AUDIO_GENERATOR: local
      LOCAL_TTS_MODEL: ${{ inputs.voice || 'chatterbox-turbo' }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      TTS_CPU_THREADS: '4'
      TTS_SEED: '42'
      STORY_SOURCE: ${{ inputs.source || 'reddit' }}
      SUBREDDIT: ${{ inputs.subreddit || 'AITAH' }}
      TARGET_SECONDS: ${{ inputs.seconds || '75' }}
      BACKGROUND_URL: ${{ inputs.background_url || vars.BACKGROUND_VIDEO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun add --global --trust @opencode/cli@2.0.29
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.14
          enable-cache: true
          cache-dependency-glob: requirements/story/*.txt
      - name: Install rendering tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libsndfile1 sox fonts-dejavu-core
      - name: Configure inputs without logging credentials
        env:
          STORY_ENV: ${{ secrets.ENV_FILE }}
        run: |
          bun -e 'await Bun.write(".env", process.env.STORY_ENV || "")'
          mkdir -p media/videos media/outputs media/scripts
      - name: Prepare explicit footage
        shell: bash
        run: |
          if [ -n "$BACKGROUND_URL" ]; then
            bun -e 'const response=await fetch(process.env.BACKGROUND_URL); if(!response.ok) throw new Error(`Footage download failed: ${response.status}`); await Bun.write("media/videos/background.mp4",response)'
          elif [ "$STORY_SOURCE" = fixture ]; then
            ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1080x1920:rate=30 -t 8 -c:v libx264 -preset ultrafast -crf 24 -pix_fmt yuv420p media/videos/background.mp4
          else
            echo 'Set BACKGROUND_VIDEO_URL as a repository variable, or supply background_url.' >&2
            exit 1
          fi
      - name: Install separate narration and alignment environments
        shell: bash
        run: |
          case "$LOCAL_TTS_MODEL" in
            chatterbox-*) voice_requirements=chatterbox ;;
            qwen3-custom) voice_requirements=qwen ;;
            kokoro) voice_requirements=kokoro ;;
          esac
          uv venv --python 3.11 .voice-venv
          uv pip sync --python .voice-venv/bin/python --extra-index-url https://download.pytorch.org/whl/cpu "requirements/story/$voice_requirements.txt"
          uv venv --python 3.11 .render-venv
          uv pip sync --python .render-venv/bin/python --extra-index-url https://download.pytorch.org/whl/cpu requirements/story/render.txt
          echo "TTS_PYTHON=$GITHUB_WORKSPACE/.voice-venv/bin/python" >> "$GITHUB_ENV"
          echo "RENDER_PYTHON=$GITHUB_WORKSPACE/.render-venv/bin/python" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: story-production-v1-${{ runner.os }}-${{ inputs.voice || 'chatterbox-turbo' }}-${{ hashFiles('config/voice-profiles.json', 'utils/story_render.py') }}
      - name: Generate using the actual application CLI
        shell: bash
        run: |
          if [ "$STORY_SOURCE" = fixture ]; then
            source_args=(--source tests/story/fixtures/source.json)
          else
            source_args=(--subreddit "$SUBREDDIT" --limit 1)
          fi
          bun run src/index.ts generate "${source_args[@]}" --background media/videos/background.mp4 --seconds "$TARGET_SECONDS" --voice "$LOCAL_TTS_MODEL" --skip-upload --concurrent 1 2>&1 | tee media/production.log
      - name: Save videos and production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-production
          path: |
            media/outputs/
            media/narrations/
            media/audios/*.timing.json
            media/audios/*.manifest.json
            media/production.log
          retention-days: 14
